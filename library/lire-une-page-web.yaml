# yaml-language-server: $schema=../csflow.schema.json
name: Lire une page web
category: Web
description: >-
  Lit une page web à partir de son adresse et en fait un résumé en français, enregistré dans le dossier « output ».
  Les pages qui se construisent entièrement avec JavaScript ne sont pas lisibles : le résumé le dit clairement.

steps:
  - id: saisie
    type: user_input
    description: Indiquer l'adresse de la page
    prompt: "Quelle page web voulez-vous lire ? (adresse complète, par exemple https://fr.wikipedia.org/wiki/Paris)"
    required: true
    save_as: output/{{run_id}}/adresse.txt

  - id: telecharger
    type: http_get
    description: Télécharger la page
    url: "{{saisie.output}}"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
    timeout: 30

  - id: garder_page
    type: file_write
    description: Garder la page téléchargée
    path: output/{{run_id}}/page.html
    content: "{{telecharger.body}}"

  - id: extraire
    type: python
    description: Extraire le texte de la page
    code: |
      import pathlib, re
      from html.parser import HTMLParser
      class Texte(HTMLParser):
          IGNORER = {"script", "style", "noscript", "svg", "template"}
          BLOCS = {"p", "div", "br", "li", "tr", "h1", "h2", "h3", "h4", "h5", "h6", "section", "article", "ul", "ol", "table"}
          def __init__(self):
              super().__init__(convert_charrefs=True)
              self.morceaux, self.profondeur = [], 0
          def handle_starttag(self, tag, attrs):
              if tag in self.IGNORER:
                  self.profondeur += 1
              elif tag in self.BLOCS:
                  self.morceaux.append("\n")
          def handle_endtag(self, tag):
              if tag in self.IGNORER and self.profondeur:
                  self.profondeur -= 1
              elif tag in self.BLOCS:
                  self.morceaux.append("\n")
          def handle_data(self, data):
              if not self.profondeur:
                  self.morceaux.append(data)
      page = pathlib.Path("output/{{run_id}}/page.html").read_text(encoding="utf-8", errors="replace")
      lecteur = Texte()
      lecteur.feed(page)
      texte = re.sub(r"[ \t\r\f\v]+", " ", "".join(lecteur.morceaux))
      texte = re.sub(r"\s*\n\s*", "\n", texte).strip()
      if len(texte) < 200:
          print("PAGE_VIDE")
      else:
          pathlib.Path("output/{{run_id}}/page.txt").write_text(texte, encoding="utf-8")
          print(texte[:20000])

  - id: resumer
    type: agent
    description: Résumer la page
    prompt: |
      Voici le texte d'une page web. Résume-la en français : de quoi parle-t-elle, puis cinq points essentiels au maximum.
      Si le texte est seulement « PAGE_VIDE », ne résume rien et réponds : « Cette page n'a pas pu être lue : son contenu
      se construit probablement avec JavaScript, ce qui n'est pas pris en charge pour l'instant. »
      Ne crée aucun fichier : réponds uniquement avec le résumé.

      ---
      {{extraire.output}}

  - id: ecrire
    type: file_write
    description: Enregistrer le résumé
    path: output/{{run_id}}/resume-page.md
    content: "{{resumer.output}}"

  - id: fin
    type: end
    message: "Résumé enregistré : output/{{run_id}}/resume-page.md"
