# yaml-language-server: $schema=../csflow.schema.json
name: Répondre à un courriel
category: Rédaction
description: >-
  Vous collez le courriel reçu et dites en quelques mots ce que vous voulez répondre ;
  l'assistant rédige une réponse polie et claire, prête à copier.

steps:
  - id: courriel
    type: user_input
    description: Coller le courriel reçu
    prompt: "Collez ici le courriel auquel vous voulez répondre."
    required: true
    save_as: output/{{run_id}}/courriel.txt

  - id: intention
    type: user_input
    description: Dire ce que vous voulez répondre
    prompt: "Que voulez-vous répondre, en quelques mots ? (exemple : j'accepte mais pas avant lundi)"
    required: true
    save_as: output/{{run_id}}/intention.txt

  - id: rediger
    type: agent
    description: Rédiger la réponse
    prompt: |
      Rédige en français une réponse à ce courriel, polie, claire et courte (dix lignes au plus), avec une formule de salutation
      et une formule de politesse adaptées. Elle doit exprimer ceci : {{intention.output}}
      Ne crée aucun fichier : réponds uniquement avec le texte de la réponse.

      Courriel reçu :
      ---
      {{courriel.output}}

  - id: ecrire
    type: file_write
    description: Enregistrer la réponse
    path: output/{{run_id}}/reponse.txt
    content: "{{rediger.output}}"

  - id: fin
    type: end
    message: "Réponse enregistrée : output/{{run_id}}/reponse.txt"
