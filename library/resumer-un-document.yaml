# yaml-language-server: $schema=../csflow.schema.json
name: Résumer un document
category: Documents
description: >-
  Lit un document déposé dans le dossier « documents » et en fait un résumé court, en français,
  enregistré dans le dossier « output ».

steps:
  - id: choix
    type: user_input
    description: Choisir le document
    prompt: "Quel document voulez-vous résumer ? Indiquez son nom tel qu'il apparaît dans le dossier « documents » (exemple : note.txt)."
    required: true
    save_as: output/{{run_id}}/choix.txt

  - id: lire
    type: file_read
    description: Lire le document
    path: documents/{{choix.output}}

  - id: resumer
    type: agent
    description: Rédiger le résumé
    prompt: |
      Voici le texte d'un document. Résume-le en français pour quelqu'un qui n'a pas le temps de le lire :
      une phrase d'introduction, puis cinq points clés au maximum sous forme de liste.
      Ne crée aucun fichier : réponds uniquement avec le résumé.

      ---
      {{lire.output}}

  - id: ecrire
    type: file_write
    description: Enregistrer le résumé
    path: output/{{run_id}}/resume.md
    content: "{{resumer.output}}"

  - id: fin
    type: end
    message: "Résumé enregistré : output/{{run_id}}/resume.md"
