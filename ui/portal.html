<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowPortal</title>
<style>
:root{--bg:#f4f6f5;--surface:#fff;--ink:#14201d;--mute:#5b6b66;--line:#dbe3e0;--accent:#0e6a5c;--accent-ink:#fff;--human:#b7791f;--mcp:#2b5fb8;--bad:#b3261e;--ok:#1b7f4b;--shadow:0 1px 2px rgba(20,32,29,.06),0 8px 24px -12px rgba(20,32,29,.18)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1513;--surface:#151e1b;--ink:#e6efec;--mute:#93a39d;--line:#27332f;--accent:#3fb59f;--accent-ink:#062019;--human:#e0a64a;--mcp:#7da6ec;--bad:#f08a82;--ok:#59c98d;--shadow:0 1px 2px #0006,0 8px 24px -12px #000a}}
:root[data-theme=dark]{--bg:#0e1513;--surface:#151e1b;--ink:#e6efec;--mute:#93a39d;--line:#27332f;--accent:#3fb59f;--accent-ink:#062019;--human:#e0a64a;--mcp:#7da6ec;--bad:#f08a82;--ok:#59c98d;--shadow:0 1px 2px #0006,0 8px 24px -12px #000a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Hanken Grotesk","Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:28px 0 18px}
header h1{font-size:30px;font-weight:700}header p{margin:2px 0 0;color:var(--mute)}
.env{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;color:var(--mute);text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.off{background:var(--bad)}.dot.run{background:var(--human)}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center}
.bar input{flex:1 1 240px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.f{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.f[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.f:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.recent{display:flex;gap:10px;overflow:auto;margin-bottom:22px;padding-bottom:4px}
.recent button{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.recent b{font-weight:600}.recent span{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent)}
.card h3{font-size:18px}.card p{margin:0;color:var(--mute);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:63px}
.line{display:flex;align-items:center;height:14px}
.n{width:12px;height:12px;border-radius:50%;background:var(--line);flex:0 0 auto}
.n.agent{background:var(--accent)}.n.human_approval,.n.user_input{background:var(--human);border-radius:3px;transform:rotate(45deg)}
.n.mcp_call,.n.mcp_tools{background:var(--mcp)}.n.python,.n.shell{background:var(--mute)}
.s{height:2px;background:var(--line);flex:1 1 4px;min-width:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--mute)}
.tag.h{color:var(--human);border-color:var(--human)}.tag.m{color:var(--mcp);border-color:var(--mcp)}.tag.a{color:var(--accent);border-color:var(--accent)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;color:var(--mute);font-size:13px}
.btn{padding:8px 16px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:40px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px;grid-column:1/-1}
dialog{border:none;padding:0;background:transparent;max-width:none;max-height:none;margin:0 0 0 auto;height:100%}
dialog::backdrop{background:rgba(10,20,17,.45)}
.panel{background:var(--surface);color:var(--ink);width:min(520px,100vw);height:100vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--line)}
.panel h2{font-size:24px}.panel .x{align-self:flex-end}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.panel input[type=text],.panel textarea.in{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.form{display:grid;gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
ol.steps li{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:14px}
ol.steps li .st{width:18px;flex:0 0 18px;text-align:center;font-weight:700;color:var(--mute)}
ol.steps li.run{background:color-mix(in srgb,var(--accent) 12%,transparent)}ol.steps li.run .st{color:var(--accent)}
ol.steps li.ok .st{color:var(--ok)}ol.steps li.err .st{color:var(--bad)}ol.steps li.wait{background:color-mix(in srgb,var(--human) 16%,transparent)}ol.steps li.wait .st{color:var(--human)}
ol.steps small{display:block;color:var(--mute);font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:12px}
.gate{border:1px solid var(--human);border-radius:10px;padding:12px;display:grid;gap:10px}
.pre{font-size:13px;color:var(--bad);border:1px solid var(--bad);border-radius:8px;padding:8px 12px}
.pre ul{margin:4px 0 0;padding-left:18px}
.res{border:1px solid var(--ok);border-radius:10px;padding:12px;color:var(--ok)}.res.bad{border-color:var(--bad);color:var(--bad)}.res.stop{border-color:var(--human);color:var(--human)}
pre.y{margin:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:12px/1.55 "IBM Plex Mono",ui-monospace,Consolas,monospace;overflow:auto;max-height:55vh;white-space:pre;tab-size:2}
.y .k{color:var(--accent)}.y .c{color:var(--mute);font-style:italic}.y .q{color:var(--mcp)}
.ytop{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.ta{width:100%;min-height:260px;height:42vh;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:13px/20px "IBM Plex Mono",ui-monospace,Consolas,monospace;white-space:pre;overflow:auto;tab-size:2}
.pi{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:5px 8px;border-radius:6px;cursor:pointer}
.pi:hover{background:var(--bg)}.pi.error{color:var(--bad)}.pi.warn{color:var(--human)}
.okmsg{color:var(--ok)}.badmsg{color:var(--bad)}.dirty{color:var(--human)}
.rb{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid}
.rb.ok{color:var(--ok)}.rb.error,.rb.interrupted{color:var(--bad)}.rb.rejected{color:var(--human)}
.hist{display:grid;gap:4px}.hist button{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;text-align:left}
.hist button:hover{border-color:var(--accent)}.hist .ok i{color:var(--ok)}.hist .error i,.hist .interrupted i{color:var(--bad)}.hist .rejected i{color:var(--human)}.hist i{font-style:normal;font-weight:700}
dialog.full{width:100vw;height:100vh;margin:0}
.fp{background:var(--bg);color:var(--ink);width:100vw;height:100vh;display:flex;flex-direction:column}
.fh{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.fh h2{font-size:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.fh .meta{font-size:13px;color:var(--mute);margin-top:2px}
.edb{flex:1;min-height:0;display:grid;grid-template-columns:1fr 300px;background:var(--surface)}
.edw{display:flex;min-height:0;border-right:1px solid var(--line)}
.eg{margin:0;padding:12px 8px 12px 12px;text-align:right;color:var(--mute);font:13px/20px "IBM Plex Mono",ui-monospace,Consolas,monospace;overflow:hidden;user-select:none;background:var(--bg);min-width:48px}
.ta.full{flex:1;height:100%;border:0;border-radius:0;resize:none;min-height:0}
#fpl{padding:12px;overflow:auto;font-size:13px}#fpl h3{font-size:15px;margin-bottom:8px}
.tabs{display:flex;gap:4px;padding:10px 20px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--mute);font:inherit;padding:8px 12px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:600}
.rvb{flex:1;overflow:auto;padding:20px;max-width:1000px;width:100%;margin:0 auto}
.sr{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.sr summary{display:grid;grid-template-columns:22px 1fr 90px;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;list-style:none}
.sr summary::-webkit-details-marker{display:none}
.sr .ic{font-weight:700;text-align:center}.sr.ok .ic{color:var(--ok)}.sr.error{border-color:var(--bad)}.sr.error .ic{color:var(--bad)}.sr.skipped,.sr.notrun{opacity:.55}.sr.rejected .ic{color:var(--human)}
.sr small{display:block;color:var(--mute);font:12px "IBM Plex Mono",ui-monospace,Consolas,monospace}
.sr .bar2{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.sr .bar2 b{display:block;height:100%;background:var(--accent)}
.sr .tm{text-align:right;font-size:12px;color:var(--mute);margin-bottom:3px}
.sr pre{margin:0;padding:12px 14px;border-top:1px solid var(--line);font:12px/1.55 "IBM Plex Mono",ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.sr.error pre{color:var(--bad)}
.fl{display:grid;grid-template-columns:260px 1fr;gap:16px}.fl .lst{display:grid;gap:6px;align-content:start}
.fl .lst button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;word-break:break-all}
.fl .lst button[aria-pressed=true]{border-color:var(--accent)}.fl .lst span{display:block;color:var(--mute);font-size:12px}
.jr{margin:0;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font:12px/1.7 "IBM Plex Mono",ui-monospace,Consolas,monospace;overflow:auto;white-space:pre}
.jr .ok{color:var(--ok)}.jr .er{color:var(--bad)}.jr .t{color:var(--mute)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px}.kv b{color:var(--mute);font-weight:500}
@media(max-width:760px){.edb{grid-template-columns:1fr;grid-template-rows:1fr 140px}.edw{border-right:0;border-bottom:1px solid var(--line)}.fl{grid-template-columns:1fr}.sr summary{grid-template-columns:22px 1fr}.sr summary .bw{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap">
<header><div><h1>FlowPortal</h1><p>Lancez un workflow en un clic. Chaque carte est un fichier YAML.</p></div>
<div class="env"><span class="chip" id="c1"></span><span class="chip" id="c2"></span><a class="chip" href="/index.html">Interface classique</a><button class="f" id="th">Thème</button></div></header>
<div id="alert"></div>
<div class="bar"><input id="q" type="search" placeholder="Rechercher un workflow" aria-label="Rechercher">
<button class="f" data-k="all" aria-pressed="true">Tous</button><button class="f" data-k="agent" aria-pressed="false">Avec CSAgent</button><button class="f" data-k="human" aria-pressed="false">Validation humaine</button><button class="f" data-k="mcp" aria-pressed="false">MCP</button><button class="f" data-k="solo" aria-pressed="false">Sans IA</button></div>
<div class="recent" id="rec"></div>
<div class="grid" id="grid"></div>
</div>

<dialog id="dlg"><div class="panel" id="pn"></div></dialog>

<dialog id="ed" class="full"><div class="fp"><div class="fh"><div><h2 id="et"></h2><span id="fst"></span></div><div class="row"><button class="f" id="erv">Annuler les modifications</button><button class="btn" id="esv">Enregistrer</button><button class="f" id="ecl">Fermer</button></div></div><div class="edb"><div class="edw"><pre class="eg" id="eg" aria-hidden="true"></pre><textarea class="ta full" id="eta" spellcheck="false" wrap="off" aria-label="Éditeur YAML"></textarea></div><aside id="fpl"></aside></div></div></dialog>

<dialog id="rvw" class="full"><div class="fp"><div class="fh"><div><h2 id="rt"></h2><div class="meta" id="rm"></div></div><div class="row"><button class="btn" id="rrl">Relancer</button><button class="f" id="rcl">Fermer</button></div></div><div class="tabs" role="tablist" id="rtb"></div><div class="rvb" id="rbd"></div></div></dialog>

<script type="text/javascript" src="/eel.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const T={agent:"Agent",file_write:"Écrit un fichier",file_read:"Lit un fichier",python:"Python",shell:"Commande",http_get:"HTTP GET",http_post:"HTTP POST",http_put:"HTTP PUT",http_delete:"HTTP DELETE",human_approval:"Validation",user_input:"Saisie",mcp_call:"Appel MCP",mcp_tools:"Outils MCP",log:"Journal",end:"Fin",transform:"Transformation"};
const BL={ok:"Réussi",error:"Échoué",rejected:"Refusé",interrupted:"Interrompu"};
const SYM={ok:"✓",error:"✕",rejected:"⏸",interrupted:"✕"};
const S={cards:[],recent:[],busy:false,filter:"all",q:"",cur:null,live:null,drafts:{},saved:{},hist:[]};
const card=f=>S.cards.find(c=>c.filename==f);
const call=async(fn,...a)=>{try{return await eel[fn](...a)()}catch(e){return{ok:false,error:"Erreur de communication : "+(e&&e.message||e)}}};
const fd=s=>{s=+s||0;return s<60?s.toFixed(1).replace(".",",")+" s":Math.floor(s/60)+" min "+String(Math.round(s%60)).padStart(2,"0")+" s"};
function ago(iso){if(!iso)return"jamais lancé";const t=new Date(iso),d=(Date.now()-t)/1000;if(d<60)return"à l'instant";if(d<3600)return"il y a "+Math.floor(d/60)+" min";if(d<86400)return"il y a "+Math.floor(d/3600)+" h";if(d<172800)return"hier";return"il y a "+Math.floor(d/86400)+" j"}
const when=iso=>{if(!iso)return"";const t=new Date(iso);return t.toLocaleDateString("fr-FR")+" "+t.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};

async function boot(){for(let i=0;i<40;i++){const r=await call("portal_list");if(r&&r.cards){S.cards=r.cards;S.recent=r.recent||[];S.busy=!!r.busy;draw();rec();env();return}await new Promise(k=>setTimeout(k,250))}
 $("#alert").innerHTML='<div class="pre" style="margin-bottom:16px">Impossible de joindre FlowPortal. Fermez cette page et relancez l\'application.</div>'}
/* ── liste ─────────────────────────────────────────────────────────── */
async function load(){const r=await call("portal_list");if(r&&r.cards){S.cards=r.cards;S.recent=r.recent||[];S.busy=!!r.busy}draw();rec();env()}
function env(){const miss=S.cards.filter(c=>!c.ready).length;$("#c1").innerHTML='<i class="dot"></i>'+S.cards.length+" workflow"+(S.cards.length>1?"s":"");
 $("#c2").innerHTML='<i class="dot '+(S.live&&S.live.running?"run":miss?"off":"")+'"></i>'+(S.live&&S.live.running?"Lancement en cours":miss?miss+" avec prérequis manquants":"Prérequis réunis")}
function line(c){const st=c.steps.filter(s=>s.type!="end");return'<div class="line" aria-hidden="true">'+st.map((s,i)=>(i?'<i class="s"></i>':'')+'<i class="n '+esc(s.type)+'"></i>').join("")+'</div>'}
function tags(c){return'<div class="tags">'+(c.tags.agent?'<span class="tag a">CSAgent</span>':'')+(c.tags.human?'<span class="tag h">Validation humaine</span>':'')+(c.tags.mcp?'<span class="tag m">MCP</span>':'')+(c.error?'<span class="tag bad">Illisible</span>':!c.ready?'<span class="tag bad">Prérequis manquant</span>':'')+'<span class="tag">'+c.steps.length+' étapes</span></div>'}
function draw(){const q=S.q;const L=S.cards.filter(c=>(S.filter=="all"||(S.filter=="solo"?!c.tags.agent:c.tags[S.filter]))&&(c.title+" "+c.description).toLowerCase().includes(q));
 $("#grid").innerHTML=S.cards.length==0?'<div class="empty">Aucun workflow dans le dossier workflows. Ajoutez un fichier .yaml.</div>':L.length?L.map(c=>'<div class="card" tabindex="0" role="button" data-f="'+esc(c.filename)+'"><h3>'+esc(c.title)+'</h3><p>'+esc(c.summary||"Pas de description.")+'</p>'+line(c)+tags(c)+'<div class="foot"><span>'+ago(c.last_run&&c.last_run.started)+'</span><button class="btn" '+(c.ready&&!S.busy?'':'disabled')+' data-run="'+esc(c.filename)+'">Lancer</button></div></div>').join(""):'<div class="empty">Aucun workflow ne correspond. Effacez la recherche ou choisissez « Tous ».</div>'}
function rec(){$("#rec").innerHTML=S.recent.map(r=>{const c=card(r.file);return'<button data-r="'+esc(r.id)+'"><b>'+esc(c?c.title:r.name)+'</b><span>'+ago(r.started)+' · '+BL[r.status]+'</span></button>'}).join("")}

/* ── panneau ───────────────────────────────────────────────────────── */
function hl(l){const m=l.match(/^(\s*(?:- )?)([A-Za-z_][\w-]*)(:)(.*)$/);if(/^\s*#/.test(l))return'<span class="c">'+esc(l)+'</span>';
 if(m){let r=m[4],c=r.indexOf(" #"),tail="";if(c>-1){tail='<span class="c">'+esc(r.slice(c))+'</span>';r=r.slice(0,c)}
  return esc(m[1])+'<span class="k">'+esc(m[2])+'</span>:'+(/^\s*["'][^"']*["']\s*$/.test(r)?'<span class="q">'+esc(r)+'</span>':esc(r))+tail}return esc(l)}
async function openCard(f,run){const c=card(f);if(!c)return;S.cur=c;S.hist=await call("portal_runs",f,8);if(!Array.isArray(S.hist))S.hist=[];
 const inp=Object.entries(c.inputs);
 $("#pn").innerHTML='<button class="f x" id="cl">Fermer</button><h2>'+esc(c.title)+'</h2><p style="margin:0;color:var(--mute)">'+esc(c.description||"")+'</p>'+tags(c)+
 (c.missing.length?'<div class="pre"><b>Ce workflow ne peut pas être lancé :</b><ul>'+c.missing.map(m=>'<li>'+esc(m)+'</li>').join("")+'</ul></div>':'')+
 (inp.length?'<div class="form">'+inp.map(([k,v])=>'<div><label for="i_'+esc(k)+'">'+esc(k)+'</label><input type="text" id="i_'+esc(k)+'" data-k="'+esc(k)+'" value="'+esc(v)+'"></div>').join("")+'</div>':'<p style="margin:0;color:var(--mute)">Aucun paramètre.</p>')+
 '<div class="row"><button class="btn" id="go">Lancer le workflow</button><button class="btn ghost" id="yb" aria-expanded="false">Voir le YAML</button></div><div id="yw" hidden></div><div id="gate"></div><div id="out"></div>'+
 '<ol class="steps" id="ol">'+c.steps.map((s,i)=>'<li id="s'+i+'"><span class="st">·</span><span>'+esc(s.label)+'<small>'+esc(s.id)+' · '+esc(T[s.type]||s.type)+'</small></span></li>').join("")+'</ol>'+
 '<div><h3 style="font-size:16px;margin:0 0 8px">Derniers lancements</h3><div id="hs"></div></div>';
 hist();const d=$("#dlg");if(!d.open)d.showModal();
 $("#cl").onclick=()=>d.close();$("#go").onclick=()=>launch();$("#yb").onclick=()=>yamlToggle();
 $("#hs").onclick=e=>{const b=e.target.closest("[data-r]");if(b)showRun(b.dataset.r)};
 syncGo();if(S.live&&S.live.file==f)liveRedraw();if(run)launch()}
function syncGo(){const g=$("#go");if(!g||!S.cur)return;const c=S.cur;g.disabled=!c.ready||S.busy||(S.live&&S.live.running)}
function hist(){const e=$("#hs");if(!e)return;e.className="hist";e.innerHTML=S.hist.length?S.hist.map(r=>'<button class="'+r.status+'" data-r="'+esc(r.id)+'"><span>'+when(r.started)+' · '+fd(r.duration)+'</span><i>'+SYM[r.status]+' '+BL[r.status]+'</i></button>').join(""):'<p style="margin:0;color:var(--mute);font-size:14px">Aucun lancement pour l\'instant.</p>'}
async function launch(){const c=S.cur;if(!c||(S.live&&S.live.running))return;const vals={};document.querySelectorAll("#pn input[data-k]").forEach(i=>vals[i.dataset.k]=i.value);
 const r=await call("portal_run",c.filename,vals);if(!r.ok){$("#out").innerHTML='<div class="pre">'+esc(r.error)+'</div>';return}
 S.live={file:c.filename,running:true,st:{},warn:[],gate:null,runId:null};S.busy=true;liveRedraw();env();draw()}
function liveRedraw(){const L=S.live;if(!L||!S.cur||S.cur.filename!=L.file||!$("#ol"))return;
 S.cur.steps.forEach((s,i)=>{const e=$("#s"+i);if(!e)return;const v=L.st[s.id]||"";e.className=v;e.querySelector(".st").textContent={run:"▶",ok:"✓",err:"✕",wait:"⏸",skip:"–"}[v]||"·"});
 $("#go").disabled=!!L.running||S.busy||!S.cur.ready;$("#go").textContent=L.running?"En cours…":"Relancer";
 const g=$("#gate");g.innerHTML="";const G=L.gate;
 if(G&&G.kind=="approval"){g.innerHTML='<div class="gate"><b>Votre décision est attendue</b><span>'+esc(G.message)+'</span><div class="row"><button class="btn" id="ap">Approuver</button><button class="btn ghost" id="rj">Refuser</button></div></div>';
  $("#ap").onclick=()=>answer("approved");$("#rj").onclick=()=>answer("rejected");$("#ap").focus()}
 if(G&&G.kind=="input"){g.innerHTML='<div class="gate"><b>'+esc(G.prompt)+'</b>'+(G.voice?'<span style="color:var(--mute);font-size:13px">La dictée n\'est disponible que dans l\'interface classique : saisissez le texte ici.</span>':'')+'<textarea class="in" id="itx" rows="4" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit"></textarea><div class="row"><button class="btn" id="iok">Valider</button><button class="btn ghost" id="ino">Annuler</button></div></div>';
  $("#itx").value=G.def||"";$("#itx").focus();const sync=()=>{$("#iok").disabled=G.required&&!$("#itx").value.trim()};sync();$("#itx").oninput=sync;
  $("#iok").onclick=async()=>{const t=$("#itx").value;L.gate=null;liveRedraw();await call("submit_input",t,false)};$("#ino").onclick=async()=>{L.gate=null;liveRedraw();await call("submit_input","",true)}}
 if(L.warn.length)$("#out").innerHTML='<div class="pre" style="color:var(--human);border-color:var(--human)">'+L.warn.map(esc).join("<br>")+'</div>'}
async function answer(a){const L=S.live;L.gate=null;if(L.waitId)L.st[L.waitId]="run";liveRedraw();await call("resolve_approval",a)}

/* ── événements du moteur ──────────────────────────────────────────── */
function receiveEvent(ev){const L=S.live,t=ev&&ev.type,id=ev&&ev.step_id;
 if(t=="portal_run_saved"){if(L){L.running=false;L.runId=ev.run_id}S.busy=false;finishLive(ev);return}
 if(!L||!L.running)return;
 if(t=="step_start")L.st[id]="run";
 else if(t=="step_done")L.st[id]="ok";
 else if(t=="step_error")L.st[id]="err";
 else if(t=="step_skip")L.st[id]="skip";
 else if(t=="workflow_warning")L.warn.push(ev.message);
 else if(t=="human_approval_required"){L.waitId=Object.keys(L.st).find(k=>L.st[k]=="run");if(L.waitId)L.st[L.waitId]="wait";L.gate={kind:"approval",message:ev.message||"Approuver ?"}}
 else if(t=="user_input_required"){L.waitId=Object.keys(L.st).find(k=>L.st[k]=="run");if(L.waitId)L.st[L.waitId]="wait";L.gate={kind:"input",prompt:ev.prompt||"Saisie demandée",def:ev.default||"",required:ev.required!==false,voice:!!ev.voice}}
 liveRedraw()}
async function finishLive(ev){const L=S.live;await load();if(!L||!S.cur||S.cur.filename!=L.file){env();return}
 S.hist=await call("portal_runs",L.file,8);if(!Array.isArray(S.hist))S.hist=[];hist();
 const r=S.hist[0];const o=$("#out");if(!o)return;
 if(r){o.innerHTML='<div class="res '+(r.status=="ok"?"":r.status=="rejected"?"stop":"bad")+'"><b>'+BL[r.status]+'</b> en '+fd(r.duration)+(r.error?' · '+esc(r.error):'')+'<div class="row" style="margin-top:8px"><button class="btn" id="vr">Voir le résultat</button></div></div>';$("#vr").onclick=()=>showRun(r.id)}
 $("#go").textContent="Relancer";syncGo();env()}
eel.expose(receiveEvent,"receiveEvent");

/* ── YAML : lecture, édition, plein écran ──────────────────────────── */
const cur=()=>{const f=S.cur.filename;return f in S.drafts?S.drafts[f]:S.saved[f]};
const dirty=()=>{const f=S.cur.filename;return f in S.drafts&&S.drafts[f]!==S.saved[f]};
let probs={P:[],e:0,w:0},ckT=null,ckSeq=0;
async function yamlToggle(){const y=$("#yw"),b=$("#yb"),op=y.hidden;y.hidden=!op;b.setAttribute("aria-expanded",op);b.textContent=op?"Masquer le YAML":"Voir le YAML";
 if(!op)return;const f=S.cur.filename;if(!(f in S.saved)){const r=await call("portal_read",f);if(!r.ok){y.innerHTML='<div class="pre">'+esc(r.error)+'</div>';return}S.saved[f]=r.yaml}
 pview(dirty()?"edit":"view")}
function pview(mode){const y=$("#yw"),f=S.cur.filename,n=cur().split("\n").length;
 if(mode=="view"){y.innerHTML='<div class="ytop"><span>workflows/'+esc(f)+' · '+n+' lignes</span><span class="row"><button class="f" id="e1">Modifier</button><button class="f" id="cp">Copier</button></span></div><pre class="y" tabindex="0">'+S.saved[f].split("\n").map(hl).join("\n")+'</pre>';
  $("#e1").onclick=()=>pview("edit");$("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(S.saved[f]);$("#cp").textContent="Copié"}catch(e){$("#cp").textContent="Copie impossible"}setTimeout(()=>{const c=$("#cp");if(c)c.textContent="Copier"},1500)}}
 else{y.innerHTML='<div class="ytop"><span id="pst"></span><span class="row"><button class="f" id="fs">Plein écran</button><button class="f" id="vw">Lecture</button></span></div><textarea class="ta" id="pta" spellcheck="false" wrap="off" aria-label="Éditeur YAML"></textarea><div class="row"><button class="btn" id="sv">Enregistrer</button><button class="btn ghost" id="rv">Annuler les modifications</button></div><div id="pl"></div>';
  wire($("#pta"),false);$("#sv").onclick=save;$("#rv").onclick=revert;$("#fs").onclick=full;$("#vw").onclick=()=>pview("view");$("#pl").onclick=e=>{const b=e.target.closest("[data-l]");if(b)jump($("#pta"),+b.dataset.l)};check()}}
function plist(P){return P.length?P.map(p=>'<button class="pi '+p.level+'" data-l="'+(p.line||1)+'">'+(p.line?"L"+p.line+" · ":"")+esc(p.message)+'</button>').join(""):'<span class="okmsg">Aucun problème détecté.</span>'}
function status(){const d=dirty(),f=S.cur.filename;return(d?'<span class="dirty">Modifications non enregistrées</span> · ':(S.cur.justSaved?'<span class="okmsg">Enregistré</span> · ':''))+(probs.e?'<span class="badmsg">'+probs.e+' erreur'+(probs.e>1?'s':'')+'</span>':'<span class="okmsg">Structure valide</span>')+(probs.w?' · '+probs.w+' avertissement'+(probs.w>1?'s':''):'')}
function refresh(){const d=dirty(),n=cur().split("\n").length,set=(i,h)=>{const e=$(i);if(e)e.innerHTML=h};
 set("#pst",status());set("#pl",plist(probs.P));set("#fst",status());set("#fpl","<h3>Problèmes</h3>"+plist(probs.P));if($("#eg"))$("#eg").textContent=Array.from({length:n},(_,i)=>i+1).join("\n");
 ["#sv","#esv"].forEach(s=>{const b=$(s);if(b)b.disabled=!d||probs.e>0});["#rv","#erv"].forEach(s=>{const b=$(s);if(b)b.disabled=!d})}
function check(){clearTimeout(ckT);const seq=++ckSeq,text=cur();ckT=setTimeout(async()=>{const r=await call("portal_check",text);if(seq!=ckSeq||!r.issues&&!r.ok&&r.error)return;
  const P=(r.issues||[]).sort((a,b)=>(a.line||0)-(b.line||0));probs={P,e:P.filter(p=>p.level=="error").length,w:P.filter(p=>p.level!="error").length};refresh()},150);refresh()}
function jump(ta,l){const L=ta.value.split("\n");let o=0;for(let i=0;i<l-1;i++)o+=L[i].length+1;ta.focus();ta.setSelectionRange(o,o+(L[l-1]||"").length);ta.scrollTop=Math.max(0,(l-4)*20)}
function wire(ta,isFull){ta.value=cur();ta.oninput=()=>{S.drafts[S.cur.filename]=ta.value;S.cur.justSaved=false;const o=isFull?$("#pta"):$("#eta");if(o)o.value=ta.value;check()};
 ta.onkeydown=e=>{if(e.key=="Tab"){e.preventDefault();ta.setRangeText("  ",ta.selectionStart,ta.selectionEnd,"end");ta.dispatchEvent(new Event("input"))}if((e.ctrlKey||e.metaKey)&&e.key=="s"){e.preventDefault();save()}};
 if(isFull)ta.onscroll=()=>{$("#eg").scrollTop=ta.scrollTop}}
async function save(){if(!dirty()||probs.e)return;const f=S.cur.filename,r=await call("portal_save",f,S.drafts[f]);
 if(!r.ok){probs={P:r.issues||[{level:"error",line:null,message:r.error}],e:1,w:0};refresh();return}
 S.saved[f]=S.drafts[f];delete S.drafts[f];await load();const wasFull=$("#ed").open,keep=!$("#yw").hidden;
 await openCard(f);if(keep)await yamlToggle();S.cur.justSaved=true;if(wasFull)$("#ed").close();if($("#pst"))refresh();
 setTimeout(()=>{if(S.cur){S.cur.justSaved=false;if($("#pst"))refresh()}},2500)}
function revert(){delete S.drafts[S.cur.filename];if($("#pta"))$("#pta").value=cur();if($("#eta"))$("#eta").value=cur();check()}
let armed=false;
function full(){armed=false;$("#et").textContent="workflows/"+S.cur.filename;$("#ecl").textContent="Fermer";wire($("#eta"),true);$("#esv").onclick=save;$("#erv").onclick=revert;
 $("#fpl").onclick=e=>{const b=e.target.closest("[data-l]");if(b)jump($("#eta"),+b.dataset.l)};$("#ed").showModal();check();$("#eta").focus()}
$("#ecl").onclick=()=>{if(dirty()&&!armed){armed=true;$("#ecl").textContent="Fermer sans enregistrer";return}$("#ed").close()};
$("#ed").addEventListener("close",()=>{if(S.cur&&$("#yw")&&!$("#yw").hidden)pview(dirty()?"edit":"view")});

/* ── résultat d'un lancement ───────────────────────────────────────── */
let cr=null,tab="steps",sf=0;
async function showRun(id){const r=await call("portal_run_detail",id);if(!r.ok){alert(r.error);return}cr=r.run;tab="steps";sf=0;const c=card(cr.file);
 $("#rt").innerHTML=esc(c?c.title:cr.name)+' <span class="rb '+cr.status+'">'+BL[cr.status]+'</span>';
 const ok=cr.steps.filter(s=>s.status=="ok").length;$("#rm").textContent="Lancé le "+when(cr.started)+" · durée "+fd(cr.duration)+" · "+ok+" étape"+(ok>1?"s":"")+" sur "+cr.steps.length+" terminée"+(ok>1?"s":"")+" · "+cr.files.length+" fichier"+(cr.files.length>1?"s":"");
 $("#rrl").onclick=()=>{$("#rvw").close();openCard(cr.file,true)};$("#rcl").onclick=()=>$("#rvw").close();$("#rrl").disabled=!c||!c.ready||S.busy;
 if(!$("#rvw").open)$("#rvw").showModal();tabs()}
function tabs(){const r=cr,L=[["steps","Étapes"],["files","Fichiers ("+r.files.length+")"],["log","Journal"],["in","Entrées"]];
 $("#rtb").innerHTML=L.map(([k,l])=>'<button role="tab" data-t="'+k+'" aria-selected="'+(k==tab)+'">'+l+'</button>').join("");$("#rtb").onclick=e=>{const b=e.target.closest("[data-t]");if(b){tab=b.dataset.t;tabs()}};body()}
async function body(){const r=cr,b=$("#rbd"),mx=Math.max(...r.steps.map(s=>+s.duration||0),.1);
 if(tab=="steps"){const f=r.steps.find(s=>s.status=="error");
  b.innerHTML=(f?'<div class="pre" style="margin-bottom:14px"><b>L\'étape « '+esc(f.id)+' » a échoué.</b> '+esc((f.output||"").split("\n")[0])+'</div>':(r.error?'<div class="pre" style="margin-bottom:14px">'+esc(r.error)+'</div>':''))+
  (r.warnings&&r.warnings.length?'<div class="pre" style="margin-bottom:14px;color:var(--human);border-color:var(--human)">'+r.warnings.map(esc).join("<br>")+'</div>':'')+
  r.steps.map(s=>'<details class="sr '+s.status+'" '+(s.status=="error"?"open":"")+'><summary><span class="ic">'+({ok:"✓",error:"✕",skipped:"–",notrun:"–",rejected:"⏸"}[s.status]||"·")+'</span><span>'+esc(s.label)+'<small>'+esc(s.id)+' · '+esc(T[s.type]||s.type)+'</small></span><span class="bw"><div class="tm">'+(s.status=="notrun"||s.status=="skipped"?"":fd(s.duration))+'</div><div class="bar2"><b style="width:'+Math.max(3,(+s.duration||0)/mx*100)+'%"></b></div></span></summary>'+(s.output?'<pre>'+esc(s.output)+'</pre>':'<pre style="color:var(--mute)">'+(s.status=="notrun"?"Non exécutée.":s.status=="skipped"?"Étape ignorée (condition skip_if).":"Pas de sortie.")+'</pre>')+'</details>').join("")}
 if(tab=="files"){if(!r.files.length){b.innerHTML='<div class="empty">Ce lancement n\'a produit aucun fichier.</div>';return}const f=r.files[sf]||r.files[0];
  b.innerHTML='<div class="fl"><div class="lst">'+r.files.map((x,i)=>'<button data-f2="'+i+'" aria-pressed="'+(i==sf)+'">'+esc(x.path)+'<span>'+(x.size==null?"absent":Math.max(1,Math.round(x.size/1024))+" Ko")+'</span></button>').join("")+'</div><div id="pv"><p style="color:var(--mute)">Chargement…</p></div></div>';
  b.querySelector(".lst").onclick=e=>{const x=e.target.closest("[data-f2]");if(x){sf=+x.dataset.f2;body()}};
  const p=await call("portal_file_preview",f.path),pv=$("#pv");if(!pv||tab!="files")return;
  pv.innerHTML=(p.ok?(p.binary?'<div class="empty">Fichier binaire ('+Math.max(1,Math.round(p.size/1024))+' Ko) : ouvrez-le avec son application.</div>':'<pre class="jr" style="max-height:55vh">'+esc(p.text)+(p.truncated?"\n… (aperçu tronqué)":"")+'</pre>'):'<div class="empty">'+esc(p.error)+'</div>')+'<div class="row" style="margin-top:10px"><button class="btn" id="of" '+(p.ok?"":"disabled")+'>Ouvrir</button><span id="om" style="align-self:center;color:var(--mute);font-size:13px"></span></div>';
  const of=$("#of");if(of)of.onclick=async()=>{const o=await call("portal_open_file",f.path);$("#om").textContent=o.ok?"Ouvert dans l'application par défaut.":o.error}}
 if(tab=="log"){let t=0,L=[];const off=x=>"+"+x.toFixed(1).replace(".",",")+" s";r.steps.forEach(s=>{if(s.status=="notrun"||s.status=="skipped"||s.status=="pending")return;L.push('<span class="t">'+off(t).padStart(9)+'</span>  ▶ '+esc(s.id)+' ('+esc(s.type)+')');t+=+s.duration||0;L.push('<span class="t">'+off(t).padStart(9)+'</span>  <span class="'+(s.status=="error"?"er":"ok")+'">'+(s.status=="error"?"✕ échec":s.status=="rejected"?"⏸ refusé":"✓ terminé")+'</span> '+esc(s.id)+' · '+fd(s.duration));if(s.status=="error")L.push('<span class="er">            '+esc((s.output||"").split("\n")[0])+'</span>')});
  b.innerHTML='<div class="ytop" style="margin-bottom:8px"><span>'+L.length+' lignes · temps cumulés (les durées des étapes sont mesurées par le moteur)</span><button class="f" id="cj">Copier</button></div><pre class="jr">'+L.join("\n")+'</pre>';
  $("#cj").onclick=async()=>{try{await navigator.clipboard.writeText(b.querySelector(".jr").textContent);$("#cj").textContent="Copié"}catch(e){$("#cj").textContent="Copie impossible"}}}
 if(tab=="in"){const e=Object.entries(r.inputs||{});b.innerHTML=e.length?'<div class="kv">'+e.map(([k,v])=>'<b>'+esc(k)+'</b><span>'+esc(v)+'</span>').join("")+'</div>':'<div class="empty">Ce workflow n\'a pas de paramètres.</div>'}}

/* ── interactions générales ────────────────────────────────────────── */
document.addEventListener("click",e=>{const r=e.target.closest("[data-run]");if(r){e.stopPropagation();openCard(r.dataset.run,true);return}
 const rr=e.target.closest("#rec [data-r]");if(rr){showRun(rr.dataset.r);return}const c=e.target.closest(".card[data-f]");if(c)openCard(c.dataset.f)});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.classList.contains("card"))openCard(e.target.dataset.f)});
$("#q").oninput=e=>{S.q=e.target.value.toLowerCase();draw()};
document.querySelectorAll(".bar .f").forEach(b=>b.onclick=()=>{S.filter=b.dataset.k;document.querySelectorAll(".bar .f").forEach(x=>x.setAttribute("aria-pressed",x==b));draw()});
$("#th").onclick=()=>{const r=document.documentElement,n=(r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))=="dark"?"light":"dark";r.dataset.theme=n;try{localStorage.setItem("fp-theme",n)}catch(e){}};
try{const t=localStorage.getItem("fp-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
if(typeof eel==="undefined"||!eel.portal_list){$("#alert").innerHTML='<div class="pre" style="margin-bottom:16px">Le portail doit être ouvert par FlowPortal : lancez <b>FlowPortal</b> (ou <b>python app.py</b>).</div>'}
else{boot();setInterval(()=>{if(!(S.live&&S.live.running)&&!$("#dlg").open&&!$("#rvw").open&&!$("#ed").open)load()},30000)}
</script></body></html>
