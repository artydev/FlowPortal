# yaml-language-server: $schema=../csflow.schema.json
name: Surveiller une page web
category: Web
description: >-
  Lit une page web et la compare à la lecture précédente : vous savez en français ce qui a changé.
  Lancez-le de temps en temps ; la première fois, il mémorise simplement la page.
  Les pages qui se construisent entièrement avec JavaScript ne sont pas lisibles.

steps:
  - id: saisie
    type: user_input
    description: Indiquer l'adresse de la page
    prompt: "Quelle page web voulez-vous surveiller ? (adresse complète)"
    required: true
    save_as: output/{{run_id}}/adresse.txt

  - id: cle
    type: python
    description: Repérer la page (une mémoire par adresse)
    code: |
      import hashlib, pathlib
      adresse = pathlib.Path("output/{{run_id}}/adresse.txt").read_text(encoding="utf-8").strip()
      print(hashlib.sha1(adresse.encode("utf-8")).hexdigest()[:10])

  - id: avant
    type: python
    description: Relire la version mémorisée
    code: |
      import pathlib
      memoire = pathlib.Path("output/surveillance/{{cle.output}}.txt")
      print(memoire.read_text(encoding="utf-8")[:20000] if memoire.is_file() else "")

  - id: telecharger
    type: http_get
    description: Télécharger la page
    url: "{{saisie.output}}"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
    timeout: 30

  - id: garder_page
    type: file_write
    description: Garder la page téléchargée
    path: output/{{run_id}}/page.html
    content: "{{telecharger.body}}"

  - id: extraire
    type: python
    description: Extraire le texte et le mémoriser
    code: |
      import pathlib, re
      from html.parser import HTMLParser
      class Texte(HTMLParser):
          IGNORER = {"script", "style", "noscript", "svg", "template"}
          BLOCS = {"p", "div", "br", "li", "tr", "h1", "h2", "h3", "h4", "h5", "h6", "section", "article", "ul", "ol", "table"}
          def __init__(self):
              super().__init__(convert_charrefs=True)
              self.morceaux, self.profondeur = [], 0
          def handle_starttag(self, tag, attrs):
              if tag in self.IGNORER:
                  self.profondeur += 1
              elif tag in self.BLOCS:
                  self.morceaux.append("\n")
          def handle_endtag(self, tag):
              if tag in self.IGNORER and self.profondeur:
                  self.profondeur -= 1
              elif tag in self.BLOCS:
                  self.morceaux.append("\n")
          def handle_data(self, data):
              if not self.profondeur:
                  self.morceaux.append(data)
      page = pathlib.Path("output/{{run_id}}/page.html").read_text(encoding="utf-8", errors="replace")
      lecteur = Texte()
      lecteur.feed(page)
      texte = re.sub(r"[ \t\r\f\v]+", " ", "".join(lecteur.morceaux))
      texte = re.sub(r"\s*\n\s*", "\n", texte).strip()
      if len(texte) < 200:
          print("PAGE_VIDE")                      # on ne remplace pas la mémoire par une page vide
      else:
          memoire = pathlib.Path("output/surveillance/{{cle.output}}.txt")
          memoire.parent.mkdir(parents=True, exist_ok=True)
          memoire.write_text(texte, encoding="utf-8")
          print(texte[:20000])

  - id: comparer
    type: agent
    description: Comparer avec la version précédente
    prompt: |
      Tu compares deux lectures d'une même page web.
      Si la version actuelle est seulement « PAGE_VIDE », réponds : « Cette page n'a pas pu être lue : son contenu se construit
      probablement avec JavaScript, ce qui n'est pas pris en charge pour l'instant. »
      Si la version précédente est vide, réponds seulement : « Première lecture : la page est mémorisée, rien à comparer. »
      Sinon, dis en français, en quelques phrases, ce qui a changé de façon importante (contenu, prix, dates, titres) ;
      ignore les changements mineurs de mise en page. S'il n'y a rien d'important, réponds : « Aucun changement important. »
      Ne crée aucun fichier : réponds uniquement avec cette analyse.

      Version précédente :
      ---
      {{avant.output}}

      Version actuelle :
      ---
      {{extraire.output}}

  - id: ecrire
    type: file_write
    description: Enregistrer le résultat de la comparaison
    path: output/{{run_id}}/changements.md
    content: "{{comparer.output}}"

  - id: fin
    type: end
    message: "Comparaison enregistrée : output/{{run_id}}/changements.md"
