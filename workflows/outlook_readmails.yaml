  # ── 3. contrôle des résultats, page finale et tri ────────────────────────────
  - id: assembler
    type: python
    description: Contrôler les résultats, page HTML finale et tri
    code: |
      import html, json, pathlib, datetime, re, time
      from urllib.parse import urlparse
      mails = json.load(open('tmp/outlook/mails.json', encoding='utf-8'))
      try:
          ids = json.load(open('tmp/outlook/ids.json', encoding='utf-8'))
      except Exception:
          ids = {}

      URL = re.compile(r'https?://[^\s<>"\')\]]+')
      IMG = re.compile(r'\.(png|jpe?g|gif|svg|webp|ico)(\?|$)', re.I)
      PONCT = ' \t-–—:;,.|·•*_=<>()[]'

      def hote(u):
          h = urlparse(u).netloc.lower()
          return h[4:] if h.startswith('www.') else h

      def rendre_ligne(ligne):
          out, etat = [], {'pos': 0, 'budget': 220, 'texte': '', 'liens': 0}
          def add_text(t):
              t = t.replace('<', '').replace('>', '')[:max(etat['budget'], 0)]
              etat['budget'] -= len(t)
              etat['texte'] += t
              if t:
                  out.append(html.escape(t))
          for mt in URL.finditer(ligne):
              add_text(ligne[etat['pos']:mt.start()])
              etat['pos'] = mt.end()
              url = mt.group(0).rstrip('.,;:!?')
              if IMG.search(url):
                  continue
              etat['liens'] += 1
              sur = html.escape(url, quote=True)
              out.append('<a href="' + sur + '" target="_blank" rel="noopener noreferrer" title="' + sur + '">'
                         + html.escape(hote(url) or 'lien') + ' ↗</a>')
          add_text(ligne[etat['pos']:])
          return ''.join(out), etat['texte'].strip(PONCT), etat['liens']

      def lignes_html(texte, n=5):
          gardees, secours = [], []
          for brut in str(texte).splitlines():
              brut = brut.strip()
              if not brut:
                  continue
              h, seul, liens = rendre_ligne(brut)
              if not h:
                  continue
              if liens and not any(c.isalpha() for c in seul):
                  secours.append(h)
                  continue
              gardees.append(h)
              if len(gardees) >= n:
                  break
          return (gardees or secours)[:n]

      def cellule(lignes):
          return ''.join('<div class="l">' + x + '</div>' for x in lignes) or '<div class="l">—</div>'

      def date_fr(iso):
          iso = str(iso or '')
          if len(iso) >= 16:
              return iso[8:10] + '/' + iso[5:7] + '/' + iso[0:4] + ' ' + iso[11:16]
          return iso

      def initiale(nom):
          for ch in nom:
              if ch.isalnum():
                  return ch.upper()
          return '?'

      CSS = """
      :root{--bg:#f4f5f7;--card:#fff;--ink:#14171f;--muted:#6b7280;--line:#e6e8ec;--accent:#4f46e5;--accent-soft:#eef0ff;--ok:#0f766e;--ok-soft:#e6f6f3;--warn:#a16207;--warn-soft:#fef6e0}
      @media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171b24;--ink:#e8eaf0;--muted:#9aa3b2;--line:#262c38;--accent:#9aa1ff;--accent-soft:#232744;--ok:#5eead4;--ok-soft:#12302d;--warn:#fcd34d;--warn-soft:#33290f}}
      *{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%}
      body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;overflow-wrap:anywhere}
      a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
      a:hover{border-bottom-color:currentColor}
      .wrap{width:100%;max-width:1040px;margin:0 auto;padding:2.5rem 1.5rem 3rem}
      header{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
      h1{margin:0;font-size:1.75rem;letter-spacing:-.02em}
      .sub{margin:.25rem 0 0;color:var(--muted);font-size:.9rem}
      .pill{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .85rem;border-radius:999px;font-size:.85rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
      .pill.ok{background:var(--ok-soft);color:var(--ok)}
      .pill.warn{background:var(--warn-soft);color:var(--warn)}
      .dot{width:.5rem;height:.5rem;border-radius:50%;background:currentColor;flex:none}
      .pill.live .dot{animation:pulse 1.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.25rem}
      .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem 1.1rem}
      .stat b{display:block;font-size:1.6rem;line-height:1.2}
      .stat span{color:var(--muted);font-size:.85rem}
      .note{margin:0 0 1.25rem;padding:.75rem 1rem;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:.9rem}
      .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
      .mail{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);column-gap:1.75rem;min-width:0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:1rem 1.15rem 1.1rem;box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);transition:transform .12s ease,box-shadow .12s ease}
      .mail:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,24,40,.06),0 10px 24px rgba(16,24,40,.09)}
      .mail.k-urgent{border-left-color:#dc2626}
      .mail.k-repondre{border-left-color:#d97706}
      .mail.k-information{border-left-color:#0891b2}
      .mail.k-ignorer{border-left-color:var(--muted)}
      .top{display:flex;align-items:center;gap:.75rem;margin:0;min-width:0;grid-column:1;grid-row:1/span 3;align-self:start}
      .subj,.chips,.sum{grid-column:2}
      .who{min-width:0;display:flex;flex-direction:column}
      .name{font-weight:600;font-size:.92rem;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
      .date{color:var(--muted);font-size:.8rem}
      .av{flex:none;display:inline-flex;align-items:center;justify-content:center;width:2.4rem;height:2.4rem;border-radius:50%;color:#fff;font-weight:700;font-size:1rem}
      .c0{background:#4f46e5}.c1{background:#0891b2}.c2{background:#059669}.c3{background:#d97706}.c4{background:#db2777}.c5{background:#7c3aed}
      .subj{margin:0 0 .65rem;font-size:1.02rem;line-height:1.35;font-weight:700}
      .subj a{color:var(--ink)}
      .subj a:hover{color:var(--accent)}
      .chips{margin-bottom:.5rem}
      .tag{display:inline-block;margin:0 .4rem .2rem 0;padding:.1rem .5rem;border-radius:6px;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--line);color:var(--muted)}
      .tag.ai{background:var(--accent-soft);color:var(--accent)}
      .cat{display:inline-block;margin:0 .4rem .2rem 0;padding:.1rem .5rem;border-radius:6px;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
      .cat.urgent{background:rgba(220,38,38,.13);color:#dc2626}
      .cat.repondre{background:rgba(217,119,6,.15);color:#d97706}
      .cat.information{background:rgba(8,145,178,.13);color:#0891b2}
      .cat.ignorer{background:var(--line);color:var(--muted)}
      .l{font-size:.92rem;line-height:1.45;margin:0 0 .2rem}
      .preview .l{color:var(--muted)}
      footer{margin-top:1.75rem;text-align:center;color:var(--muted);font-size:.8rem}
      @media (max-width:700px){.wrap{padding:1.25rem 1rem 2rem}h1{font-size:1.4rem}.mail{grid-template-columns:minmax(0,1fr)}.top{grid-row:auto;margin-bottom:.8rem}.subj,.chips,.sum{grid-column:1}}
      @media print{body{background:#fff}.mail{box-shadow:none;break-inside:avoid}.pill.live .dot{animation:none}a{color:inherit}}
      """

      def ligne(m, lignes, resume_ia, cat=''):
          nom = m.get('de') or '(inconnu)'
          classe_av = 'c' + str(sum(ord(c) for c in nom) % 6)
          cle = {'à répondre': 'repondre'}.get(cat, cat)
          cls = '' if resume_ia else ' preview'
          etiquette = '<span class="tag ai">Résumé CSAgent</span>' if resume_ia else '<span class="tag">Aperçu</span>'
          puce = ('<span class="cat ' + cle + '">' + html.escape(cat) + '</span>') if cat else ''
          objet = html.escape(m.get('objet') or '(sans objet)')
          ident = ids.get(str(m.get('n')))
          if ident:
              objet = '<a href="outlook:' + html.escape(ident, quote=True) + '" title="Ouvrir dans Outlook">' + objet + '</a>'
          return ('<article class="mail' + (' k-' + cle if cat else '') + '">'
                  '<div class="top"><span class="av ' + classe_av + '">' + html.escape(initiale(nom)) + '</span>'
                  '<div class="who"><span class="name" title="' + html.escape(nom, quote=True) + '">' + html.escape(nom) + '</span>'
                  '<span class="date">' + date_fr(m.get('recu')) + '</span></div></div>'
                  '<h3 class="subj">' + objet + '</h3>'
                  '<div class="chips">' + etiquette + puce + '</div>'
                  '<div class="sum' + cls + '">' + cellule(lignes) + '</div></article>')

      def construire(rows, statut, classe, nb_ia, note, refresh, nb_action=None):
          maintenant = datetime.datetime.now().strftime('%d/%m/%Y à %H:%M')
          return ('<!doctype html><html lang="fr"><head><meta charset="utf-8">'
                  '<meta name="viewport" content="width=device-width,initial-scale=1">' + refresh
                  + '<title>Derniers mails</title><style>' + CSS + '</style></head><body><div class="wrap">'
                  '<header><div><h1>Derniers mails</h1><p class="sub">Boîte de réception Outlook · généré le '
                  + maintenant + '</p></div><span class="pill ' + classe + '"><span class="dot"></span>'
                  + html.escape(statut) + '</span></header>'
                  '<div class="stats"><div class="stat"><b>' + str(len(mails)) + '</b><span>mails analysés</span></div>'
                  '<div class="stat"><b>' + str(nb_ia) + '</b><span>résumés CSAgent</span></div>'
                  + ('<div class="stat"><b>' + str(nb_action) + '</b><span>à traiter (urgent ou à répondre)</span></div>' if nb_action is not None else '')
                  + '</div>'
                  + ('<p class="note">' + html.escape(note) + '</p>' if note else '')
                  + '<div class="grid">' + ''.join(rows) + '</div><footer>Généré par FlowPortal</footer></div></body></html>')

      import unicodedata, glob
      def norm(t):
          t = unicodedata.normalize('NFKD', str(t or '').lower()).encode('ascii', 'ignore').decode()
          return re.sub(r'[^a-z0-9]+', '', t)
      def meme(a, b, mini):
          a, b = norm(a), norm(b)
          return len(a) >= 1 and len(b) >= 1 and (a == b or (len(a) >= mini and len(b) >= mini and (a in b or b in a)))
      CATS = ('urgent', 'à répondre', 'information', 'ignorer')
      def categorie(c):
          c = norm(c)
          for k in CATS:
              if norm(k) in c:
                  return k
          return 'information'
      def texte_de(v):
          if isinstance(v, list):
              return '\n'.join(str(x) for x in v)
          return str(v or '')

      items = []
      for f in sorted(glob.glob('tmp/outlook/res/lot_*.json')):
          try:
              d = json.load(open(f, encoding='utf-8'))
          except Exception:
              continue
          if isinstance(d, dict):
              d = next((v for v in d.values() if isinstance(v, list)), [])
          items.extend(x for x in d if isinstance(x, dict))

      par_n = dict((m['n'], m) for m in mails)
      analyse, rejetes = {}, 0
      for it in items:
          cible = None
          try:
              m = par_n.get(int(str(it.get('n')).strip()))
          except Exception:
              m = None
          if m and meme(it.get('objet'), m.get('objet'), 8) and (not it.get('de') or meme(it.get('de'), m.get('de'), 3)):
              cible = m
          else:
              cands = [x for x in mails if meme(it.get('objet'), x.get('objet'), 8)]
              if len(cands) > 1:
                  cands = [x for x in cands if meme(it.get('de'), x.get('de'), 3)]
              if len(cands) == 1:
                  cible = cands[0]
          if cible is None:
              rejetes += 1
          else:
              analyse[cible['n']] = it

      rows, nb_ia, nb_action = [], 0, 0
      for m in mails:
          it = analyse.get(m['n'])
          lr = lignes_html(texte_de(it.get('resume'))) if it else []
          if lr:
              nb_ia += 1
              cat = categorie(it.get('categorie'))
              if cat in ('urgent', 'à répondre'):
                  nb_action += 1
              rows.append(ligne(m, lr, True, cat))
          else:
              rows.append(ligne(m, lignes_html(m.get('corps')), False))

      total = len(mails)
      note = ''
      if nb_ia == total and not rejetes:
          statut, classe = 'Résumés terminés', 'ok'
      else:
          statut, classe = str(nb_ia) + '/' + str(total) + ' résumés', 'warn'
          note = 'Pour les mails sans résumé, l\'aperçu du texte est affiché. '
          if rejetes:
              note += str(rejetes) + ' résultat(s) de CSAgent écarté(s) : expéditeur ou objet ne correspondaient pas au mail. '
          if not items:
              note += 'CSAgent n\'a produit aucun résultat : vérifiez qu\'il a été lancé depuis le dossier de FlowPortal.'
      contenu = construire(rows, statut, classe, nb_ia, note.strip(), '', nb_action)
      pathlib.Path('tmp/outlook/mails.html').write_text(contenu, encoding='utf-8')

      def esc(t):
          return str(t or '').replace('|', '/').replace('\n', ' ')
      md = ['| Expéditeur | Objet | Catégorie | Raison |', '|---|---|---|---|']
      for m in mails:
          it = analyse.get(m['n'])
          cat = categorie(it.get('categorie')) if it else 'non analysé'
          md.append('| ' + esc(m.get('de')) + ' | ' + esc(m.get('objet')) + ' | ' + cat + ' | ' + esc(it.get('raison') if it else '') + ' |')
      pathlib.Path('tmp/outlook/triage.md').write_text('\n'.join(md) + '\n', encoding='utf-8')
      print(nb_ia, end='')

  - id: fin
    type: end
    message: "Terminé : {{assembler.output}} résumé(s) sur {{compter.output}} mail(s). Page : tmp/outlook/mails.html"
